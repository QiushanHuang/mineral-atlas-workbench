<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线晶面图谱</title><link rel="icon" href="logo.png" type="image/png"><link rel="stylesheet" href="style.css"><body>
<header><div style="display:flex;align-items:center;gap:14px"><img src="logo.png" alt="Mineral Atlas logo" width="54" height="54" style="object-fit:contain"><div><small>MINERAL ATLAS / OFFLINE</small><h1>晶面 · 空间与拓扑</h1></div></div><p>参考参数构形 · 来源与假设随结果保留</p></header><nav id="models"></nav><main>
<div class="intro"><div><h2 id="title"></h2><p id="description"></p></div></div>
<section class="card pad facts"><h3>晶体学五项信息</h3><a href="report.html">完整报告与校验记录 ↗</a> · <a href="point-groups.html">32种晶体学点群对照 ↗</a><div id="crystalFacts"></div><p id="indexBasis"></p><div id="formbuttons" class="tools"></div></section>
<section class="work"><div class="card"><div class="bar"><strong>三维空间模型</strong><div><button id="standard" class="active">教材定向</button><button id="reset">照片视角</button><button id="iso">自由视角</button><button id="wire">线框</button><button id="axes" class="active">晶轴</button><button id="ridges" hidden>补棱位置</button></div></div><div class="stage"><canvas id="modelCanvas" aria-label="拖动旋转三维模型，点击可见面选择"></canvas><span id="modelHint" class="hint"></span></div><div class="tools"><label>查找面 <input id="query"></label><button id="find">定位</button><button id="opposite">平行相反面</button><span id="message" role="status"></span></div><div id="facebuttons"></div></div>
<div class="card"><div class="bar"><strong>原图对照</strong><div><button id="photoMode">原图</button><button id="overlayMode">线框叠加</button></div></div><div class="stage"><canvas id="photoCanvas" aria-label="照片与候选模型线框"></canvas><span class="hint" id="photoHint"></span></div><div class="tools"><label>照片 <select id="photoSelect"></select></label><a id="original" target="_blank" rel="noopener">原图</a></div><p class="metric" id="metric"></p></div></section>
<section class="lower"><div class="card pad"><h3>面邻接拓扑</h3><p>连线表示共用真实棱；二维布局不是空间坐标。</p><div id="graph"></div><p id="topology"></p></div><div class="card pad"><h3>所选晶面</h3><div id="selected"></div><div class="binding"><label for="miller">会话内补充标记</label><div class="tools"><input id="miller"><button id="bind">添加标定</button></div><p>手动内容仅本次会话有效，不改变保存的参考参数。</p></div></div><div class="card pad"><h3>来源与限制</h3><div id="observations"></div></div></section>
<details class="card pad" open><summary>逐面指数与证据</summary><div id="faceTable"></div></details>
<footer><a href="input.json">输入参数</a><a href="model.json">完整几何</a><a href="quality.json">校验结果</a><a href="receipt.json">可复现记录</a></footer></main><script src="data.js"></script><script src="viewer.js"></script></body></html>
